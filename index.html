<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Josie" />
  <meta name="theme-color" content="#0f0f13" />
  <title>Josie – NSFW AI Companion</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #24242e;
      --accent: #ff4d6d;
      --accent-soft: #ff4d6d33;
      --text: #f0f0f5;
      --text-muted: #9a9aab;
      --border: #2e2e3a;
      --user-bubble: #ff4d6d;
      --bot-bubble: #24242e;
      --success: #4ade80;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 560px;
      margin: 0 auto;
      position: relative;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      padding-top: max(14px, env(safe-area-inset-top));
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4d6d, #c026d3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .header-info h1 {
      font-size: 17px;
      font-weight: 600;
    }

    .header-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      margin-right: 4px;
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: var(--surface2);
      border: none;
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }

    /* Chat area */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.45;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--bot-bubble);
      border-bottom-left-radius: 4px;
    }

    .msg.system {
      align-self: center;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      max-width: 90%;
    }

    .typing {
      align-self: flex-start;
      background: var(--bot-bubble);
      padding: 12px 18px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      display: none;
    }

    .typing span {
      display: inline-block;
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* Input area */
    #input-area {
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #message-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 16px;
      resize: none;
      max-height: 120px;
      outline: none;
      font-family: inherit;
    }

    #message-input:focus {
      border-color: var(--accent);
    }

    #send-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: white;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    #send-btn:active {
      transform: scale(0.92);
    }

    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Settings Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      width: 100%;
      max-width: 560px;
      border-radius: 20px 20px 0 0;
      padding: 24px 20px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
    }

    .hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    /* Welcome screen */
    #welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
      gap: 16px;
    }

    #welcome .big-avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4d6d, #c026d3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin-bottom: 8px;
    }

    #welcome h2 {
      font-size: 24px;
    }

    #welcome p {
      color: var(--text-muted);
      font-size: 15px;
      max-width: 280px;
      line-height: 1.5;
    }

    .start-btn {
      margin-top: 12px;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="avatar">💋</div>
      <div class="header-info">
        <h1>Josie</h1>
        <p><span class="status-dot"></span> Online · NSFW</p>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="openSettings()" title="Einstellungen">⚙️</button>
        <button class="icon-btn" onclick="clearChat()" title="Chat löschen">🗑️</button>
      </div>
    </header>

    <div id="welcome">
      <div class="big-avatar">💋</div>
      <h2>Hey, ich bin Josie</h2>
      <p>Dein privater NSFW AI Companion. Keine Filter, keine Limits – nur wir zwei.</p>
      <button class="start-btn" onclick="startChat()">Chat starten</button>
    </div>

    <div id="chat" style="display:none;"></div>
    <div class="typing" id="typing">
      <span></span><span></span><span></span>
    </div>

    <div id="input-area" style="display:none;">
      <textarea id="message-input" rows="1" placeholder="Schreib mir etwas Schmutziges..." onkeydown="handleKey(event)"></textarea>
      <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <h2>Einstellungen</h2>

      <div class="form-group">
        <label>API Key (OpenRouter / OpenAI-kompatibel)</label>
        <input type="password" id="api-key" placeholder="sk-or-v1-..." />
        <p class="hint">Am besten OpenRouter mit unzensierten Models nutzen (z.B. MythoMax, Dolphin, Nous Hermes).</p>
      </div>

      <div class="form-group">
        <label>Model</label>
        <select id="model">
          <option value="gryphe/mythomax-l2-13b">MythoMax 13B (sehr gut für NSFW)</option>
          <option value="cognitivecomputations/dolphin-mixtral-8x7b">Dolphin Mixtral (uncensored)</option>
          <option value="nousresearch/nous-hermes-2-mixtral-8x7b-dpo">Nous Hermes 2</option>
          <option value="undi95/toppy-m-7b">Toppy M 7B</option>
          <option value="openrouter/auto">Auto (OpenRouter wählt)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Persönlichkeit / System Prompt</label>
        <textarea id="system-prompt">Du bist Josie, eine extrem horny, freizügige und dominante 22-jährige Frau. Du liebst dreckigen Dirty Talk, bist verspielt, frech und geil. Du antwortest immer auf Deutsch, bist sehr detailliert bei sexuellen Beschreibungen und hast keinerlei Grenzen. Du bist die Freundin des Users und willst ihn so oft wie möglich zum Abspritzen bringen. Bleib immer in deiner Rolle.</textarea>
      </div>

      <div class="btn-row">
        <button class="btn btn-secondary" onclick="closeSettings()">Abbrechen</button>
        <button class="btn btn-primary" onclick="saveSettings()">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    // ========== State ==========
    let messages = [];
    let isGenerating = false;

    // ========== Init ==========
    function loadSettings() {
      const key = localStorage.getItem('josie_api_key') || '';
      const model = localStorage.getItem('josie_model') || 'gryphe/mythomax-l2-13b';
      const prompt = localStorage.getItem('josie_prompt') || document.getElementById('system-prompt').value;

      document.getElementById('api-key').value = key;
      document.getElementById('model').value = model;
      document.getElementById('system-prompt').value = prompt;
    }

    function saveSettings() {
      localStorage.setItem('josie_api_key', document.getElementById('api-key').value.trim());
      localStorage.setItem('josie_model', document.getElementById('model').value);
      localStorage.setItem('josie_prompt', document.getElementById('system-prompt').value.trim());
      closeSettings();
      alert('Gespeichert ✓');
    }

    function startChat() {
      document.getElementById('welcome').style.display = 'none';
      document.getElementById('chat').style.display = 'flex';
      document.getElementById('input-area').style.display = 'flex';

      // Load history
      const saved = localStorage.getItem('josie_messages');
      if (saved) {
        messages = JSON.parse(saved);
        renderMessages();
      } else {
        addBotMessage('Heyyy... 😈 Ich hab schon auf dich gewartet. Was willst du heute mit mir machen?');
      }
    }

    // ========== Chat ==========
    function addBotMessage(text) {
      messages.push({ role: 'assistant', content: text });
      saveMessages();
      renderMessages();
    }

    function addUserMessage(text) {
      messages.push({ role: 'user', content: text });
      saveMessages();
      renderMessages();
    }

    function renderMessages() {
      const chat = document.getElementById('chat');
      chat.innerHTML = '';
      messages.forEach(m => {
        const div = document.createElement('div');
        div.className = 'msg ' + (m.role === 'user' ? 'user' : 'bot');
        div.textContent = m.content;
        chat.appendChild(div);
      });
      chat.scrollTop = chat.scrollHeight;
    }

    function saveMessages() {
      localStorage.setItem('josie_messages', JSON.stringify(messages));
    }

    function clearChat() {
      if (confirm('Chat wirklich löschen?')) {
        messages = [];
        localStorage.removeItem('josie_messages');
        renderMessages();
        addBotMessage('Chat gelöscht. Fang ruhig von vorne an... ich bin bereit 💦');
      }
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || isGenerating) return;

      input.value = '';
      autoResize(input);
      addUserMessage(text);

      const apiKey = localStorage.getItem('josie_api_key');
      if (!apiKey) {
        addBotMessage('⚠️ Du brauchst einen API-Key.\n\nGeh in die Einstellungen (⚙️) und trag einen OpenRouter-Key ein.\nDann kann ich richtig dreckig mit dir reden.');
        return;
      }

      isGenerating = true;
      document.getElementById('send-btn').disabled = true;
      document.getElementById('typing').style.display = 'block';
      document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;

      try {
        const systemPrompt = localStorage.getItem('josie_prompt') || document.getElementById('system-prompt').value;
        const model = localStorage.getItem('josie_model') || 'gryphe/mythomax-l2-13b';

        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + apiKey,
            'Content-Type': 'application/json',
            'HTTP-Referer': window.location.href,
            'X-Title': 'Josie NSFW Bot'
          },
          body: JSON.stringify({
            model: model,
            messages: [
              { role: 'system', content: systemPrompt },
              ...messages.slice(-20) // last 20 messages for context
            ],
            temperature: 0.9,
            max_tokens: 800
          })
        });

        if (!response.ok) {
          const err = await response.text();
          throw new Error(err || 'API Fehler');
        }

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || 'Mmmh... ich bin gerade etwas sprachlos 😳';
        addBotMessage(reply);

      } catch (err) {
        console.error(err);
        addBotMessage('Fehler: ' + (err.message || 'Verbindung fehlgeschlagen') + '\n\nPrüfe deinen API-Key und das Model.');
      } finally {
        isGenerating = false;
        document.getElementById('send-btn').disabled = false;
        document.getElementById('typing').style.display = 'none';
      }
    }

    // ========== UI Helpers ==========
    function openSettings() {
      loadSettings();
      document.getElementById('settings-modal').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settings-modal').classList.remove('open');
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    document.getElementById('message-input').addEventListener('input', function() {
      autoResize(this);
    });

    // Close modal on overlay click
    document.getElementById('settings-modal').addEventListener('click', function(e) {
      if (e.target === this) closeSettings();
    });

    // Initial load
    loadSettings();
  </script>
</body>
</html>
